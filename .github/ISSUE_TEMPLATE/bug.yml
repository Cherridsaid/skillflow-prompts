name: Reproducible bug
description: Use synthetic data. Report vulnerabilities through SECURITY.md.
body:
  - type: textarea
    id: environment
    attributes:
      label: Version, OS and deployment mode
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction and observed effect
      description: Exclude secrets and business documents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and untested paths
