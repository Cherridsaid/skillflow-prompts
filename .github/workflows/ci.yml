name: core-and-protocol
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-09-14
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, resolved 2026-09-14
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.14
      - run: uv sync --locked
      - run: uv run ruff check src tests benchmarks scripts
      - run: uv run ruff format --check src tests benchmarks scripts
      - run: uv run pytest
      - run: uv run skillflow-prompts schemas --output schemas --check
      - run: uv run skillflow-prompts demo --root .skillflow/ci-demo
      - run: uv build
