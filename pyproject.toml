[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "skillflow-prompts"
version = "0.1.0"
description = "SkillFlow workflow contracts triggered by a prompt, with mechanical checks and signed receipts"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "S. Cherrid"}]
dependencies = [
  "mcp==1.29.0", "cryptography==50.0.1", "jsonschema==4.26.0",
  "fastapi==0.141.1", "uvicorn>=0.51,<0.53", "httpx==0.28.1",
  "pydantic==2.13.4",
  "wsproto==1.3.2",
]

[project.scripts]
skillflow-prompts = "skillflow_prompts.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7", "hatchling==1.32.0"]

[tool.uv]
exclude-newer = "2026-09-11T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/skillflow_prompts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
